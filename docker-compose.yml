services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: worldbuilding
      POSTGRES_USER: worldbuilding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldbuilding -d worldbuilding"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
